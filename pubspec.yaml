name: jeokissan_5t_quality_management_system
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_functions: ^4.7.0
  device_preview: ^1.3.1
  image_picker: ^1.1.2
  google_generative_ai: ^0.4.6
  url_launcher: ^6.3.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  google_fonts: ^8.0.2
  image: ^4.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/jekissan Logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/jekissan Logo.png"
  windows:
    generate: true
    image_path: "assets/images/jekissan Logo.png"
  macos:
    generate: true
    image_path: "assets/images/jekissan Logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/quality_manual_data.json
    - assets/quality_manual_data_urdu.json

  fonts:
    - family: JameelNooriNastaleeqKasheeda
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeqKasheeda.ttf
